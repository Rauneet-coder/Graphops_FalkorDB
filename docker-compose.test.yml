# Test-only negative control: ordinary Redis with NO graph module. Reuses the
# pinned image's redis-server binary; this is not a fourth production service.
services:
  falkordb:
    ports: !reset []
  frontend:
    ports: !reset []
  plain-redis:
    image: falkordb/falkordb:6.0.2@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    entrypoint: ["redis-server"]
    command: ["--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
  backend:
    ports: !reset []
    environment:
      PLAIN_REDIS_HOST: plain-redis
