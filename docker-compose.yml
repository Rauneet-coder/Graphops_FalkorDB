services:
  falkordb:
    image: falkordb/falkordb:6.0.2@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    ports:
      - "127.0.0.1:${FALKORDB_PUBLISHED_PORT:-6379}:6379"
    environment:
      BROWSER: "0"
      FALKORDB_DATA_PATH: /var/lib/falkordb/data
      FALKORDB_GRAPH: ${FALKORDB_GRAPH:-graphops}
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --save 60 1"
      FALKORDB_ARGS: "THREAD_COUNT 2 MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      # Backend lifecycle initializes the empty graph; this probe stays read-only.
      test: ["CMD-SHELL", "redis-cli --raw GRAPH.RO_QUERY \"$$FALKORDB_GRAPH\" 'RETURN 1' TIMEOUT 500 | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PUBLISHED_PORT:-8000}:8000"
    environment:
      FALKORDB_HOST: ${FALKORDB_HOST:-falkordb}
      FALKORDB_PORT: ${FALKORDB_PORT:-6379}
      FALKORDB_GRAPH: ${FALKORDB_GRAPH:-graphops}
      FALKORDB_CONNECT_TIMEOUT_SECONDS: ${FALKORDB_CONNECT_TIMEOUT_SECONDS:-1}
      FALKORDB_SOCKET_TIMEOUT_SECONDS: ${FALKORDB_SOCKET_TIMEOUT_SECONDS:-2}
      FALKORDB_QUERY_TIMEOUT_MS: ${FALKORDB_QUERY_TIMEOUT_MS:-500}
      GRAPH_WORKERS: ${GRAPH_WORKERS:-4}
      GRAPH_INIT_RETRY_SECONDS: ${GRAPH_INIT_RETRY_SECONDS:-1}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      # No circular health dependency: backend creates the graph key, then both
      # read-only readiness probes succeed. Startup retries tolerate a slow DB.
      falkordb:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PUBLISHED_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s

volumes:
  falkordb_data:
